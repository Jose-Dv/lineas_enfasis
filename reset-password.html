<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Restablecer contraseña</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body class="reset-body">

    <div class="reset-container">

        <div class="reset-card">

            <div class="reset-logo">
                <img src="assets/logo.png" alt="Logo" />
            </div>

            <h1>Nueva contraseña</h1>

            <p>
                Crea una contraseña segura para acceder
                nuevamente a la plataforma.
            </p>

            <input
                type="password"
                id="newPassword"
                placeholder="Nueva contraseña"
            />

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirmar contraseña"
            />

            <button onclick="updatePassword()">
                Actualizar contraseña
            </button>

            <span id="resetMessage"></span>

        </div>

    </div>

   <script>

    const { createClient } = supabase;

    const supabaseClient = createClient(
        https://aheliwdjayivxxkijslk.supabase.co,
        sb_publishable_C3j6BeolYGSj-hOWcADS8A_M1-fS27n
    );

    async function updatePassword(){

        const password = document
            .getElementById("newPassword")
            .value;

        const confirm = document
            .getElementById("confirmPassword")
            .value;

        const message = document
            .getElementById("resetMessage");

        if(password.length < 6){
            message.innerHTML =
                "La contraseña debe tener mínimo 6 caracteres";
            return;
        }

        if(password !== confirm){
            message.innerHTML =
                "Las contraseñas no coinciden";
            return;
        }

        const { error } =
            await supabaseClient.auth.updateUser({
                password: password
            });

        if(error){
            message.innerHTML = error.message;
            return;
        }

        message.innerHTML =
            "Contraseña actualizada correctamente";

        setTimeout(()=>{
            window.location.href = "index.html";
        },2000);
    }

</script>

</body>
</html>
